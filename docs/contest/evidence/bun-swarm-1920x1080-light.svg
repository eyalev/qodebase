<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="A real agent swarm gave up on branches" style="--bg:#ffffff;--card:#f3f4f6;--line:#e2e4e8;--fg:#111214;--dim:#6e737b;--acc:#17695a;--busy:#b7791f;--bad:#b4322a;--bar:#a9aeb6" font-family="Geist, 'Instrument Sans', system-ui, sans-serif"><rect width="1920" height="1080" fill="var(--bg)"/><text x="160" y="164.4" font-size="64" font-weight="600" fill="var(--fg)" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">A real agent swarm gave up on branches</text><text x="160" y="230.4" font-size="30" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Bun's port from Zig to Rust, written by about 64 Claude agents (oven-sh/bun#30412).</text><text x="160" y="270.9" font-size="30" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Most commits went straight onto one shared branch, agents splitting the files between them.</text><rect x="160" y="326.9" width="382" height="230" rx="14" fill="var(--card)"/><rect x="160.5" y="327.4" width="381" height="229" rx="14" fill="none" stroke="var(--line)"/><text x="190" y="417.7" font-size="76" font-weight="600" fill="var(--fg)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">6,755</text><text x="190" y="530.9" font-size="26" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">commits</text><rect x="566" y="326.9" width="382" height="230" rx="14" fill="var(--card)"/><rect x="566.5" y="327.4" width="381" height="229" rx="14" fill="none" stroke="var(--line)"/><text x="596" y="417.7" font-size="76" font-weight="600" fill="var(--fg)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">11</text><text x="596" y="530.9" font-size="26" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">days</text><rect x="972" y="326.9" width="382" height="230" rx="14" fill="var(--card)"/><rect x="972.5" y="327.4" width="381" height="229" rx="14" fill="none" stroke="var(--line)"/><text x="1002" y="417.7" font-size="76" font-weight="600" fill="var(--acc)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">81%</text><text x="1002" y="497.09999999999997" font-size="26" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">straight onto one</text><text x="1002" y="530.9" font-size="26" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">shared branch</text><rect x="1378" y="326.9" width="382" height="230" rx="14" fill="var(--card)"/><rect x="1378.5" y="327.4" width="381" height="229" rx="14" fill="none" stroke="var(--line)"/><text x="1408" y="417.7" font-size="76" font-weight="600" fill="var(--fg)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">9 s</text><text x="1408" y="497.09999999999997" font-size="26" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">between commits</text><text x="1408" y="530.9" font-size="26" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">(median)</text><text x="160" y="840" font-size="22" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Source: sim/bun/calibration.json, sim/bun/analyze.mjs</text></svg>
