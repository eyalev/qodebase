<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="A real agent swarm gave up on branches" style="--bg:#ffffff;--card:#f3f4f6;--line:#e2e4e8;--fg:#111214;--dim:#6e737b;--acc:#17695a;--busy:#b7791f;--bad:#b4322a;--bar:#a9aeb6" font-family="Geist, 'Instrument Sans', system-ui, sans-serif"><rect width="1080" height="1350" fill="var(--bg)"/><text x="56" y="136.7" font-size="62" font-weight="600" fill="var(--fg)" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">A real agent swarm</text><text x="56" y="206.14" font-size="62" font-weight="600" fill="var(--fg)" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">gave up on branches</text><text x="56" y="280.14" font-size="38" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Bun's port from Zig to Rust, written by</text><text x="56" y="331.44" font-size="38" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">about 64 Claude agents. Most commits</text><text x="56" y="382.74" font-size="38" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">went onto one shared branch, agents</text><text x="56" y="434.03999999999996" font-size="38" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">splitting the files between them.</text><rect x="56" y="498.03999999999996" width="472" height="250" rx="14" fill="var(--card)"/><rect x="56.5" y="498.53999999999996" width="471" height="249" rx="14" fill="none" stroke="var(--line)"/><text x="86" y="592.04" font-size="80" font-weight="600" fill="var(--fg)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">6,755</text><text x="86" y="722.04" font-size="36" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">commits</text><rect x="552" y="498.03999999999996" width="472" height="250" rx="14" fill="var(--card)"/><rect x="552.5" y="498.53999999999996" width="471" height="249" rx="14" fill="none" stroke="var(--line)"/><text x="582" y="592.04" font-size="80" font-weight="600" fill="var(--fg)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">11</text><text x="582" y="722.04" font-size="36" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">days</text><rect x="56" y="772.04" width="472" height="250" rx="14" fill="var(--card)"/><rect x="56.5" y="772.54" width="471" height="249" rx="14" fill="none" stroke="var(--line)"/><text x="86" y="866.04" font-size="80" font-weight="600" fill="var(--acc)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">81%</text><text x="86" y="949.24" font-size="36" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">straight onto one</text><text x="86" y="996.04" font-size="36" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">shared branch</text><rect x="552" y="772.04" width="472" height="250" rx="14" fill="var(--card)"/><rect x="552.5" y="772.54" width="471" height="249" rx="14" fill="none" stroke="var(--line)"/><text x="582" y="866.04" font-size="80" font-weight="600" fill="var(--fg)" letter-spacing="-2" style="font-variant-numeric:tabular-nums">9 s</text><text x="582" y="949.24" font-size="36" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">between commits</text><text x="582" y="996.04" font-size="36" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">(median)</text><text x="56" y="1252" font-size="30" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Source: sim/bun/calibration.json,</text><text x="56" y="1291" font-size="30" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">sim/bun/analyze.mjs</text></svg>
