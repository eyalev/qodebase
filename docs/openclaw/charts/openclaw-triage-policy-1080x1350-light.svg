<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Giving the triage agent OpenClaw's policy docs did not help: right 55% with them, 59% without" style="--bg:#ffffff;--card:#f3f4f6;--line:#e2e4e8;--fg:#111214;--dim:#6e737b;--acc:#17695a;--busy:#b7791f;--bad:#b4322a;--bar:#a9aeb6" font-family="Geist, 'Instrument Sans', system-ui, sans-serif"><rect width="1080" height="1350" fill="var(--bg)"/><text x="56" y="136.7" font-size="62" font-weight="600" fill="var(--fg)" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">OpenClaw's policy docs</text><text x="56" y="206.14" font-size="62" font-weight="600" fill="var(--fg)" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">did not help the agent:</text><text x="56" y="275.58000000000004" font-size="62" font-weight="600" fill="var(--fg)" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">55% with, 59% without</text><text x="56" y="355.58000000000004" font-size="44" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">The same 299 issues both ways;</text><text x="56" y="414.98" font-size="44" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">the docs cost 1.7x as much</text><text x="56" y="508.98" font-size="40" font-weight="600" fill="var(--fg)" style="font-variant-numeric:tabular-nums">Right overall</text><text x="56" y="553.98" font-size="34" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Agent</text><rect x="276" y="530.98" width="638" height="26" rx="4" fill="var(--card)"/><rect x="276.5" y="531.48" width="637" height="25" rx="4" fill="none" stroke="var(--line)"/><line x1="435.5" x2="435.5" y1="526.98" y2="560.98" stroke="var(--dim)" stroke-width="2" stroke-dasharray="4 4"/><rect x="613.502" y="533.98" width="70.818" height="20" rx="4" fill="var(--bar)"></rect><circle cx="649.23" cy="543.98" r="12" fill="var(--dim)" stroke="var(--bg)" stroke-width="3"/><text x="928" y="554.98" font-size="36" font-weight="600" fill="var(--dim)" style="font-variant-numeric:tabular-nums">59%</text><text x="56" y="668.98" font-size="34" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">+ policy docs</text><rect x="276" y="645.98" width="638" height="26" rx="4" fill="var(--card)"/><rect x="276.5" y="646.48" width="637" height="25" rx="4" fill="none" stroke="var(--line)"/><line x1="435.5" x2="435.5" y1="641.98" y2="675.98" stroke="var(--dim)" stroke-width="2" stroke-dasharray="4 4"/><rect x="591.81" y="648.98" width="71.45599999999999" height="20" rx="4" fill="var(--bar)"></rect><circle cx="628.176" cy="658.98" r="12" fill="var(--dim)" stroke="var(--bg)" stroke-width="3"/><text x="928" y="669.98" font-size="36" font-weight="600" fill="var(--dim)" style="font-variant-numeric:tabular-nums">55%</text><text x="56" y="808.98" font-size="40" font-weight="600" fill="var(--fg)" style="font-variant-numeric:tabular-nums">Duplicates found</text><text x="56" y="853.98" font-size="34" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Agent</text><rect x="276" y="830.98" width="638" height="26" rx="4" fill="var(--card)"/><rect x="276.5" y="831.48" width="637" height="25" rx="4" fill="none" stroke="var(--line)"/><rect x="603.932" y="833.98" width="135.89399999999998" height="20" rx="4" fill="var(--bar)"></rect><circle cx="676.0260000000001" cy="843.98" r="12" fill="var(--dim)" stroke="var(--bg)" stroke-width="3"/><text x="928" y="854.98" font-size="36" font-weight="600" fill="var(--dim)" style="font-variant-numeric:tabular-nums">63%</text><text x="56" y="968.98" font-size="34" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">+ policy docs</text><rect x="276" y="945.98" width="638" height="26" rx="4" fill="var(--card)"/><rect x="276.5" y="946.48" width="637" height="25" rx="4" fill="none" stroke="var(--line)"/><rect x="608.398" y="948.98" width="137.17" height="20" rx="4" fill="var(--bar)"></rect><circle cx="681.13" cy="958.98" r="12" fill="var(--dim)" stroke="var(--bg)" stroke-width="3"/><text x="928" y="969.98" font-size="36" font-weight="600" fill="var(--dim)" style="font-variant-numeric:tabular-nums">64%</text><text x="56" y="1252" font-size="30" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">Source: qb9, paired McNemar exact p = 0.13. The right</text><text x="56" y="1291" font-size="30" font-weight="400" fill="var(--dim)" style="font-variant-numeric:tabular-nums">answers came from the same policy, so this measures following its rules</text></svg>
