<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To-do</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1b1e; --dim: #70747b; --line: #e6e7ea; --card: #f5f6f7; --acc: #1d7a55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111315; --fg: #e9eaec; --dim: #9ba0a6; --line: #26292d; --card: #1a1c1f; --acc: #4cc28d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .count { color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  li.done span { color: var(--dim); text-decoration: line-through; }
  li span { flex: 1; word-break: break-word; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--acc); }
  .del { border: 0; background: none; color: var(--dim); font-size: 20px; padding: 4px 8px; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .row { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] { flex: 1; font: 16px system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.add { border: 0; border-radius: 10px; padding: 0 18px; background: var(--acc); color: #fff; font: 600 16px system-ui, sans-serif; }
  .empty { color: var(--dim); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>To-do</h1>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>
<form id="f"><div class="row"><input type="text" id="t" placeholder="Add a task" autocomplete="off" enterkeyhint="done"><button class="add">Add</button></div></form>
<script>
  // Tasks live in this browser only (localStorage), so each visitor has their own list.
  const KEY = 'todo.items.v1';
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };
  const $list = document.getElementById('list'), $count = document.getElementById('count');

  function render() {
    $list.innerHTML = '';
    if (!items.length) $list.innerHTML = '<li class="empty">Nothing to do. Add something below.</li>';
    for (const it of items) {
      const li = document.createElement('li');
      li.className = it.done ? 'done' : '';
      const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: it.done });
      cb.onchange = () => { it.done = cb.checked; save(); render(); };
      const span = Object.assign(document.createElement('span'), { textContent: it.text });
      const del = Object.assign(document.createElement('button'), { className: 'del', textContent: '×', ariaLabel: 'Delete' });
      del.onclick = () => { items = items.filter((x) => x !== it); save(); render(); };
      li.append(cb, span, del);
      $list.append(li);
    }
    const left = items.filter((x) => !x.done).length;
    $count.textContent = items.length ? `${left} of ${items.length} left` : '';
  }
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const t = document.getElementById('t');
    if (!t.value.trim()) return;
    items.push({ text: t.value.trim(), done: false });
    t.value = '';
    save(); render();
  };
  render();
</script>
</body>
</html>
