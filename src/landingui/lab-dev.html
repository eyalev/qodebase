<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Variants lab (dev)</title>
<!-- Local preview of qodebase.app/lab: from the forq root, python3 -m http.server 8790, then open
     /src/landingui/lab-dev.html?mock=1 (&own, &theme=dark). Data comes from public/lab/. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fafafa;--chip:#f3f4f6;--line:#ececef;--fg:#111214;--dim:#6e737b;--acc:#17695a;--acc-fg:#fff;--busy:#b7791f;--warn:#b42d1f;color-scheme:light}
:root[data-theme=dark]{--bg:#0c0d0e;--card:#141517;--chip:#1c1d20;--line:#222428;--fg:#ececee;--dim:#9a9fa6;--acc:#4fbf9f;--acc-fg:#0c0d0e;--busy:#e0a948;--warn:#f08a7e;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 Geist,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:12px 16px 32px}
</style>
<link rel="stylesheet" href="./lab.css">
<script>{const q=new URLSearchParams(location.search);if(q.get('theme')==='dark')document.documentElement.dataset.theme='dark';}</script>
</head>
<body><main>
<div id="lab" data-base="/public/lab"></div>
<script>{const q=new URLSearchParams(location.search);if(q.has('own'))document.getElementById('lab').dataset.own='';if(q.get('base'))document.getElementById('lab').dataset.base=q.get('base');}</script>
<script src="./lab.js"></script>
</main></body>
</html>
